<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="100%" height="100%" fill="none" role="img" aria-label="Serena Estado Vacío">
  <title>Serena — Estado Vacío</title>
  <defs>
    <linearGradient id="emptyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8F6" />
      <stop offset="100%" stop-color="#EAF0EC" />
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FA38F" />
      <stop offset="100%" stop-color="#4E9A86" />
    </linearGradient>
  </defs>

  <!-- Círculo de apoyo zen suave -->
  <circle cx="140" cy="110" r="95" fill="url(#emptyBgGrad)" stroke="#E5E9E5" stroke-width="2" />
  
  <!-- Aura zen de fondo -->
  <ellipse cx="140" cy="195" rx="80" ry="12" fill="#E2EAE5" />

  <!-- Personaje Serena centrado -->
  <g transform="translate(40, 10)">
    <!-- Cabello posterior / moño -->
    <ellipse cx="100" cy="80" rx="28" ry="18" fill="#24150D" />
    <circle cx="100" cy="84" r="18" fill="#1C100A" />

    <!-- Torso / Traje -->
    <path d="M 60 185 C 62 145 80 125 100 120 C 120 125 138 145 140 185 Z" fill="#123F36" />
    <path d="M 85 120 L 100 144 L 115 120 Z" fill="#FAF7F2" />
    <path d="M 82 120 L 100 155 L 94 185 L 70 185 Z" fill="#285C50" />
    <path d="M 118 120 L 100 155 L 106 185 L 130 185 Z" fill="#285C50" />

    <!-- Cuello -->
    <path d="M 90 95 L 90 122 C 90 128 94 132 100 132 C 106 132 110 128 110 122 L 110 95 Z" fill="#F3CBB3" />

    <!-- Rostro -->
    <path d="M 75 66 C 75 42 86 34 100 34 C 114 34 125 42 125 66 C 125 87 114 102 100 102 C 86 102 75 87 75 66 Z" fill="#F7D4C1" />

    <!-- Ojos serenos amables -->
    <circle cx="89" cy="66" r="3.2" fill="#2E1D13" />
    <circle cx="90" cy="65" r="1" fill="#FFFFFF" />
    <circle cx="111" cy="66" r="3.2" fill="#2E1D13" />
    <circle cx="112" cy="65" r="1" fill="#FFFFFF" />
    <path d="M 84 60 C 87 58 92 58 95 60" stroke="#3A2317" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 105 60 C 108 58 113 58 116 60" stroke="#3A2317" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Nariz y Sonrisa -->
    <path d="M 99 65 L 99 73 L 102 73" stroke="#E2A688" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M 93 83 C 96 87 104 87 107 83" stroke="#C26A5D" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="83" cy="73" r="5" fill="#F49E8D" opacity="0.25" />
    <circle cx="117" cy="73" r="5" fill="#F49E8D" opacity="0.25" />

    <!-- Cabello recogido frontal -->
    <path d="M 75 60 C 75 38 86 28 100 28 C 114 28 125 38 125 60 C 125 61 122 48 116 41 C 110 34 102 33 95 35 C 87 37 80 46 75 60 Z" fill="#2D1A10" />
    <path d="M 76 58 C 80 48 90 43 100 43 C 90 48 82 56 77 68 Z" fill="#3A2316" />

    <!-- Carpeta / Cuaderno clínico en brazos -->
    <g transform="translate(74, 138)">
      <rect x="0" y="0" width="52" height="38" rx="4" fill="url(#folderGrad)" stroke="#123F36" stroke-width="1.5" />
      <rect x="5" y="5" width="42" height="28" rx="2" fill="#FAF7F2" />
      <!-- Líneas de notas -->
      <line x1="10" y1="12" x2="38" y2="12" stroke="#B0C4B8" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="18" x2="34" y2="18" stroke="#B0C4B8" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="24" x2="28" y2="24" stroke="#7FA38F" stroke-width="2" stroke-linecap="round" />
      <!-- Pequeño símbolo serena en portada de la carpeta -->
      <circle cx="43" cy="28" r="3" fill="#123F36" />
      <!-- Manos sosteniendo la carpeta -->
      <ellipse cx="2" cy="20" rx="5" ry="6" fill="#F7D4C1" />
      <ellipse cx="50" cy="20" rx="5" ry="6" fill="#F7D4C1" />
    </g>
  </g>
</svg>
