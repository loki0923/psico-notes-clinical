<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="SERENA Favicon">
  <title>SERENA Favicon</title>
  <!-- Fondo redondeado suave Verde Bosque -->
  <rect width="64" height="64" rx="14" fill="#123F36" />
  <!-- Curva complementaria superior-izquierda en blanco -->
  <path d="M 17.5 44.5 A 21 21 0 0 1 46.5 15.5" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <!-- Curva complementaria inferior-derecha en verde salvia -->
  <path d="M 51.5 20.5 A 21 21 0 0 1 22.5 49.5" stroke="#7FA38F" stroke-width="5" stroke-linecap="round" />
  <!-- Punto focal central -->
  <circle cx="32" cy="32" r="5" fill="#FFFFFF" />
</svg>
