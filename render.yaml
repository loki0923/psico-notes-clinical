services:
  - type: web
    name: psico-notes-clinical
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: SESSION_SECRET
        generateValue: true
