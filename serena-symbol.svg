<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Símbolo SERENA">
  <title>Símbolo SERENA</title>
  <defs>
    <linearGradient id="serenaCurveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123F36" />
      <stop offset="100%" stop-color="#285C50" />
    </linearGradient>
    <linearGradient id="serenaCurveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FA38F" />
      <stop offset="100%" stop-color="#4E9A86" />
    </linearGradient>
  </defs>
  <!-- Curva complementaria superior-izquierda (Verde bosque / petróleo) -->
  <path d="M 22.5 69.5 A 34 34 0 0 1 69.5 22.5" stroke="url(#serenaCurveGrad1)" stroke-width="7.5" stroke-linecap="round" />
  <!-- Curva complementaria inferior-derecha (Verde salvia / petróleo suave) -->
  <path d="M 77.5 30.5 A 34 34 0 0 1 30.5 77.5" stroke="url(#serenaCurveGrad2)" stroke-width="7.5" stroke-linecap="round" />
  <!-- Punto focal central: atención, equilibrio y escucha activa -->
  <circle cx="50" cy="50" r="7.5" fill="#123F36" />
</svg>
